name: Text'nPayMe
description: >-
  Text'nPayMe is an award-winning B2B fintech company, established in Armenia and
  incorporated in the USA in 2022, that builds embedded payment solutions for banks,
  fintechs, telecoms, and online shops. Its two core products are a Payment Keyboard
  SDK, which embeds send-money transactions directly inside 150+ messaging, social,
  and gaming apps via a payment keyboard for iOS, Android, and a Chrome extension,
  and a Payment Gateway Hub for transaction routing, reconciliation, and reporting.
  The company markets an "Apex Security Layer" with proprietary encryption and risk
  management, supports cross-border payments, and joined the 500 Global accelerator
  after winning the Entrepreneurship World Cup 2022 National Finals. The SDK is
  delivered to enterprise customers through direct integration engagements rather than
  a public self-serve developer portal, so no public API specification, developer
  documentation, or client packages are currently published.
